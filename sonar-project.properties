# SonarQube Project Configuration for SolarSaathi
sonar.projectKey=solarsaathi-rooftop
sonar.projectName=SolarSaathi Rooftop Solar Platform
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=node_modules/**,.next/**,public/**,out/**,dist/**,coverage/**,submission.zip
sonar.test.inclusions=tests/**/*.mjs,tests/**/*.ts,tests/**/*.tsx,**/*.test.ts,**/*.test.tsx

# Quality & Code Analysis Settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
